          <a class="ac_button ac_button--movie"

		<!--Resume Page-->
        <article class="assignment-card card-resume">
          <a class="ac_button ac_button--resume" 
		     href="./resume.html"
			 >See Page
		    </a>
          </article>
		  
		<!--Blog Card-->
        <article class="assignment-card card-blog">
          <a class="ac_button ac_button--blog" 
		     href="./blog.html"

		<!--Party Card-->

	  <!--About Me-->

	    >

		  />

	  <!--Creative Page-->
      <a href="./creative.html"

		  />

	<!--Video-->
      <section class="home-video-card" 
	           aria-label="featured-video-title"
	    >
        <div
          id="portfolio-video"
          class="home-video-card__media"
          data-video-src="./css/content/videos/final.MOV"
		  >
          </div>
		  
        <p class="home-video-card__note">
		  </p>
      </section>  
	</main>

    <script>
      const container = document.getElementById("portfolio-video");

      if (container) {
        const src = container.dataset.videoSrc;
        const poster = container.dataset.poster;

        // Create video element
        const video = document.createElement("video");
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;

        if (poster) {
          video.poster = poster;
        }

        // Create source element
        const source = document.createElement("source");
        source.src = src;
        source.type = "video/mp4";

        video.appendChild(source);
        container.appendChild(video);
      }
    </script>

  </body>		  
</html>
